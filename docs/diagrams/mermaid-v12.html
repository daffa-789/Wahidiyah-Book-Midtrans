<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagram Skripsi — Mermaid 12.2.0</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px;
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    background: #f1f5f9; color: #0f172a;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #64748b; margin: 0 0 28px; font-size: 13px; }
  section {
    background: #fff; border: 1px solid #cbd5e1; border-radius: 12px;
    padding: 20px; margin-bottom: 24px; overflow: auto;
  }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bar h2 { font-size: 15px; margin: 0; flex: 1; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid #334155; background: #0f172a; color: #fff;
  }
  button:hover { background: #1e293b; }
  .stage { display: flex; justify-content: center; min-height: 60px; }
  .err {
    white-space: pre-wrap; background: #fef2f2; border: 1px solid #fecaca;
    color: #991b1b; padding: 12px; border-radius: 8px; font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  .warn {
    background: #fffbeb; border: 1px solid #fcd34d; color: #78350f;
    padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px;
  }
</style>
</head>
<body>
  <h1>Diagram UML — Perpustakaan Digital Wahidiyah</h1>
  <p class="meta">Renderer lokal, Mermaid di-pin ke <strong>12.2.0</strong> (butuh &ge; 12.0.0 untuk <code>usecase-beta</code>). Isinya disamakan dengan <code>wahidiyah_book_uml_all.drawio</code>: dua aktor (Pengguna &amp; Pengelola, tanpa Tamu) dan Activity dua lane. Perlu internet untuk memuat pustaka dari CDN.</p>
  <div id="app"></div>

<script type="text/x-mermaid" data-title="1. Use Case Diagram — Perpustakaan Digital Wahidiyah">
---
config:
  theme: redux-color
  look: neo
  layout: elk
  themeVariables:
    usecaseIncludeLine: "#E11D48"
    usecaseExtendLine: "#7C3AED"
---
usecase-beta
direction LR

%% ================= AKTOR UTAMA =================
actor Member("Pengguna Anggota")
actor Admin("Pengelola Admin")
Admin --|> Member

%% ================= AKTOR SEKUNDER =================
actor Midtrans("Midtrans Core API")
actor OtpGw("Gateway OTP dan Surel")
actor Push("Web Push VAPID")
actor Supabase("Supabase PostgreSQL")@{ type: hollow }

%% ================= BATAS SISTEM: 3 MODUL =================
systemBoundary SBpub["Akses Terbuka"]
  UC01("UC01: Lihat Katalog & Filter Kategori")
  UC02("UC02: Baca Buku Publik")
  UC03("UC03: Daftar Akun Dual-Channel OTP")
  UC04("UC04: Verifikasi OTP & Lockout 10 Menit")
end

systemBoundary SBpro["Modul Keanggotaan Pro"]
  UC05("UC05: Masuk Email & Google OAuth")
  UC06("UC06: Baca Buku Pro - Protected Reader")
  UC07("UC07: Last-Read Tracker")
  UC08("UC08: Pesan Paket Langganan Pro")
  UC09("UC09: Bayar QRIS Real & CAS Idempoten")
  UC10("UC10: Unduh Faktur PDF")
end

systemBoundary SBadm["Modul Administrasi"]
  UC11("UC11: Kelola Buku & Kompresi WebP")
  UC12("UC12: Kelola Agenda & Banner Karousel")
  UC13("UC13: Kelola Pengguna & Verifikasi Transfer")
  UC14("UC14: Ekspor Laporan Excel")
  UC15("UC15: Visual Analytics Tren Pendapatan")
  UC16("UC16: Kirim Pengingat Agenda Web Push")
end

%% ================= ASOSIASI =================
Member --> UC01
Member --> UC02
Member --> UC03
Member --> UC05
Member --> UC06
Member --> UC08
Member --> UC10
Admin --> UC11
Admin --> UC12
Admin --> UC13
Admin --> UC14
Admin --> UC15
Admin --> UC16

%% ================= INCLUDE / EXTEND =================
UC03 ..> : include UC04
UC08 ..> : include UC09
UC07 ..> : extend UC06
UC10 ..> : extend UC09
UC16 ..> : extend UC12

%% ================= SISTEM EKSTERNAL =================
Midtrans --> UC09
OtpGw --> UC04
Push --> UC16
Supabase --> UC14

%% ================= WARNA KELOMPOK =================
classDef terbuka stroke:#0284c7,stroke-width:2px
classDef member stroke:#16A34A,stroke-width:2px
classDef admin stroke:#D97706,stroke-width:2px
classDef sistem fill:#FCFDFE,stroke:#334155,stroke-width:2px
class UC01,UC02,UC03,UC04 terbuka
class UC05,UC06,UC07,UC08,UC09,UC10 member
class UC11,UC12,UC13,UC14,UC15,UC16 admin
class SBpub,SBpro,SBadm sistem
</script>

<script type="text/x-mermaid" data-title="2. Activity Diagram — Alur Pengguna & Pengelola">
---
config:
  theme: base
  flowchart:
    curve: linear
---
flowchart TD
    classDef aksi fill:#FFFFFF,stroke:#0F172A,stroke-width:1.5px,color:#0F172A
    classDef keputusan fill:#FEF9C3,stroke:#CA8A04,stroke-width:2px,color:#1F2937
    classDef sukses fill:#DCFCE7,stroke:#16A34A,stroke-width:2px,color:#14532D
    classDef gagal fill:#FEE2E2,stroke:#DC2626,stroke-width:2px,color:#7F1D1D
    classDef info fill:#F1F5F9,stroke:#475569,stroke-width:1.5px,color:#334155
    classDef terminal fill:#0F172A,stroke:#0F172A,color:#FFFFFF
    classDef lane fill:#F8FAFC,stroke:#94A3B8,stroke-width:1.5px,color:#0F172A

    subgraph L1["PENGGUNA (Anggota)"]
        direction TB
        MULAI(("Mulai")):::terminal
        U1["Telusuri katalog & filter kategori kitab"]:::aksi
        U2["Baca kitab publik pada ruang baca PDF"]:::aksi
        U3["Daftar akun - email + nomor WhatsApp"]:::aksi
        U4["Masukkan kode OTP dua kanal"]:::aksi
        D1{"OTP valid sebelum<br/>5 percobaan?"}:::keputusan
        LOCK["Akun terkunci 10 menit"]:::gagal
        U5["Masuk dengan kata sandi<br/>atau Google OAuth"]:::aksi
        D2{"Perlu akses kitab Pro?"}:::keputusan
        FREE["Lanjut baca koleksi gratis"]:::info
        U6["Pesan paket Pro & bayar QRIS"]:::aksi
        D3{"Status pembayaran<br/>berhasil?"}:::keputusan
        WATCH["Pantau timer QRIS 15 menit"]:::info
        U7["Akses Pro aktif & halaman<br/>terakhir tersimpan otomatis"]:::sukses
        U8["Baca kitab Pro pada protected reader"]:::aksi
        U9["Unduh faktur / kwitansi PDF"]:::aksi
        U10["Perbarui profil & masa langganan"]:::aksi
        SELESAI(("Selesai")):::terminal
    end

    subgraph L2["PENGELOLA (Admin)"]
        direction TB
        MULAI2(("Mulai")):::terminal
        A1["Masuk sebagai pengelola"]:::aksi
        A2["Unggah kitab & sampul<br/>kompresi WebP otomatis"]:::aksi
        A3["Kelola agenda acara & banner karousel"]:::aksi
        A4["Kirim pengingat agenda - web push"]:::aksi
        A5["Ekspor laporan Excel & analytics"]:::aksi
        A6["Kelola peran & akses Pro pengguna"]:::aksi
        SELESAI2(("Selesai")):::terminal
        A7["Monitoring transaksi &<br/>audit idempotensi"]:::aksi
        D4{"Perlu verifikasi<br/>transfer manual?"}:::keputusan
        A8["Tetapkan status transaksi<br/>terverifikasi"]:::aksi
    end

    MULAI --> U1 --> U2 --> U3 --> U4 --> D1
    D1 -->|"tidak"| LOCK
    LOCK -->|"coba lagi setelah 10 menit"| U4
    D1 -->|"ya"| U5 --> D2
    D2 -->|"tidak"| FREE --> SELESAI
    D2 -->|"ya"| U6 --> D3
    D3 -->|"belum"| WATCH
    WATCH -->|"cek ulang"| D3
    D3 -->|"ya"| U7 --> U8 --> U9 --> U10 --> SELESAI

    MULAI2 --> A1 --> A2 --> A3 --> A4 --> A5 --> A6 --> SELESAI2
    A7 --> D4
    D4 -->|"ya"| A8
    D4 -->|"tidak perlu, QRIS auto-settle"| D3
    A8 -->|"status terverifikasi"| U7
    U6 -.->|"transaksi baru masuk"| A7

    class L1,L2 lane
</script>

<script type="text/x-mermaid" data-title="3. Sequence Diagram — QRIS Dual Path (Webhook + Polling)">
---
config:
  theme: base
  sequence:
    actorMargin: 90
    messageMargin: 44
    mirrorActors: false
---
sequenceDiagram
    autonumber
    actor U as Pengguna
    participant FE as Klien Web React 19
    participant BE as Backend API Express
    participant MID as Midtrans Core API
    participant DB as Supabase PostgreSQL

    U->>FE: Pilih paket Pro & klik 'Bayar QRIS'
    FE->>BE: POST /api/payments/qris/charge (JWT)
    BE->>BE: Validasi Zod & generate order_id unik
    BE->>MID: POST /v2/charge (payment_type: qris)
    MID-->>BE: 200 OK (qr_string, expire_time 15m)
    BE->>DB: INSERT transactions (status: pending)
    DB-->>BE: Baris tersimpan
    BE-->>FE: 201 Created (qr_string, order_id, expires_at)
    FE-->>U: Render QR code & timer hitung mundur
    FE--)BE: Polling GET /qris/:id/status (tiap 3s)

    Note over U,MID: Pembayaran nyata terjadi di e-wallet pengguna, di luar sistem

    U->>MID: Pindai QRIS & transfer dana

    rect rgb(240, 253, 244)
        Note over MID,DB: JALUR A - Webhook (sumber kebenaran status)
        MID->>BE: POST /midtrans/notification
        BE->>BE: Verifikasi signature SHA-512 & timingSafeEqual
        BE->>DB: CAS UPDATE status=success WHERE status=pending
        DB-->>BE: Rows affected = 1 (klaim berhasil)
        BE->>DB: activatePaidMembership() INSERT subscriptions
        DB-->>BE: Langganan Pro aktif (+30 hari)
        BE-->>MID: 200 OK (webhook acknowledged)
    end

    rect rgb(255, 251, 235)
        Note over FE,BE: JALUR B - Polling (menjaga UX saat webhook lambat)
        loop tiap beberapa detik sampai kedaluwarsa
            FE->>BE: GET /qris/:orderId/status
            BE->>DB: SELECT status, is_pro FROM transactions
            DB-->>BE: status=success, is_pro=true
            BE-->>FE: 200 OK (Membership Pro Active)
        end
    end

    FE->>FE: BroadcastChannel postMessage(UPDATED)
    FE-->>U: Tampilkan faktur & buka ruang baca
</script>

<script type="module">
const MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs";
const app = document.getElementById("app");

function fail(msg) {
  app.innerHTML = `<p class="err">Gagal memuat Mermaid 12.2.0 dari CDN.\n${msg}</p>`;
}

let mermaid;
try {
  const mod = await import(MERMAID_URL);
  mermaid = mod.default;
} catch (e) {
  fail(String(e));
  throw e;
}

mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

const sources = [...document.querySelectorAll('script[type="text/x-mermaid"]')];

for (let i = 0; i < sources.length; i++) {
  const el = sources[i];
  const title = el.dataset.title || `Diagram ${i + 1}`;
  const section = document.createElement("section");
  section.innerHTML = `<div class="bar"><h2>${title}</h2><button type="button">Unduh SVG</button></div><div class="stage"></div>`;
  app.appendChild(section);

  const stage = section.querySelector(".stage");
  if (/Activity/.test(title)) {
    const warn = document.createElement("p");
    warn.className = "warn";
    warn.textContent =
      "Gambar ini hanya pratinjau isi, bukan figures untuk naskah. Mermaid tidak bisa menata " +
      "swimlane berdampingan: arah di dalam subgraph diabaikan begitu ada edge lintas-lane, jadi " +
      "kedua lane selalu ditumpuk (rasio ~0,20). Untuk diagram activity 2 lane yang rapi pakai " +
      "halaman 'Activity Diagram - Alur Pengguna & Pengelola' di wahidiyah_book_uml_all.drawio " +
      "(rasio 0,86).";
    section.insertBefore(warn, stage);
  }
  try {
    const { svg } = await mermaid.render(`d${i}`, el.textContent.trim());
    stage.innerHTML = svg;
    section.querySelector("button").addEventListener("click", () => {
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".svg";
      a.click();
      URL.revokeObjectURL(a.href);
    });
  } catch (e) {
    stage.innerHTML = "";
    const pre = document.createElement("div");
    pre.className = "err";
    pre.textContent = `${title}\n\n${e?.message || e}`;
    stage.appendChild(pre);
  }
}
</script>
</body>
